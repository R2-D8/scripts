name: Build video_downloader.exe (Windows)

on:
    workflow_dispatch:
    push:
        paths:
            - other/video_downloader/**
            - .github/workflows/build-video-downloader-windows-exe.yml

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Build onefile exe
              shell: pwsh
              run: |
                  Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
                  ./other/video_downloader/packaging/windows/build_onefile.ps1

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: video_downloader-windows-exe
                  path: other/video_downloader/dist/video_downloader.exe
